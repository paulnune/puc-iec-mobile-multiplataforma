# Gera iosApp.xcodeproj: `cd iosApp && xcodegen generate`. O projeto gerado também vai para o git.
name: iosApp
options:
  bundleIdPrefix: com.puciec.eleicoes
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # O shared só tem alvos arm64 (iosArm64 e iosSimulatorArm64): sem x86_64 no simulador.
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Eleições 2026
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puciec.eleicoes.ios
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Só iPhone: a folha de compartilhar da Colinha não tem âncora de popover e derrubaria o app no iPad.
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    preBuildScripts:
      - name: Compilar o Kotlin (framework Shared)
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$JAVA_HOME" ]; then export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null)"; fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
