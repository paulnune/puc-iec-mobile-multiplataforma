name: pf-eleicoes-kmp-ios

# Prova de que o app roda no iOS: compila o módulo shared (lógica e UI Compose) para o simulador,
# roda os testes do commonTest num simulador de iPhone, linka o framework "Shared" e builda o
# projeto Xcode iosApp.
# Também builda o APK num Mac, para provar que os alvos iOS não atrapalham quem builda
# o app Android no macOS. Precisa de macOS (Xcode). Não é check obrigatório da
# projeto-final: o check obrigatório continua sendo o pf-eleicoes-kmp.
on:
  pull_request:
    branches: [projeto-final]
    paths:
      - 'exercicios/projeto-final/eleicoes-kmp/**'
      - '.github/workflows/pf-eleicoes-kmp-ios.yml'
  push:
    branches: [projeto-final]
    paths:
      - 'exercicios/projeto-final/eleicoes-kmp/**'
      - '.github/workflows/pf-eleicoes-kmp-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pf-eleicoes-kmp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: testes no simulador iOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: exercicios/projeto-final/eleicoes-kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode e simuladores disponíveis
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Testes do commonTest no simulador, framework do iOS e APK
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 :androidApp:assembleDebug --stacktrace

      - name: Build do app iOS (projeto Xcode)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste-ios
          path: exercicios/projeto-final/eleicoes-kmp/shared/build/reports/tests/
