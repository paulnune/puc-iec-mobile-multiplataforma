name: pf-eleicoes-kmp

# Build e testes do app do Projeto Final em todo PR para a projeto-final.
# Sem chave da API: os testes usam fontes falsas, e o build passa com a chave vazia.
on:
  pull_request:
    branches: [projeto-final]
  push:
    branches: [projeto-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pf-eleicoes-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: exercicios/projeto-final/eleicoes-kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build do APK e testes
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest :androidApp:testDebugUnitTest --stacktrace

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: exercicios/projeto-final/eleicoes-kmp/**/build/reports/tests/
